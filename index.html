<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>gilbertoesp — Understanding with you</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Barlow+Condensed:wght@300;400;600;700&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ═══════════════════════════════
     NAV
════════════════════════════════ -->
<nav>
  <a href="index.html" class="nav-logo" aria-current="page"><span>@</span>gilbertoesp</a>

  <div class="nav-right">
    <ul class="nav-links" id="nav-links">
      <li><a href="blog.html"      data-i18n="nav.blog"      onclick="closeNav()">Blog</a></li>
      <li><a href="portfolio.html" data-i18n="nav.portfolio" onclick="closeNav()">Portfolio</a></li>
      <li><a href="material.html"  data-i18n="nav.material"  onclick="closeNav()">Material</a></li>
      <li><a href="#contact"       data-i18n="nav.contact"   onclick="closeNav()">Contact</a></li>
    </ul>

    <button class="lang-toggle" id="lang-toggle" aria-label="Switch language">
      <span class="flag-emoji" id="flag-to-es">🇲🇽</span>
      <span class="flag-emoji" id="flag-to-en">🇺🇸</span>
    </button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ═══════════════════════════════
     HERO
════════════════════════════════ -->
<section class="hero">
  <div class="hero-grid-bg"></div>
  <div class="hero-glow"></div>
  <div class="hero-story">
    <div class="hero-story__part hero-story__part--1">
      <p class="hero-story__num">01</p>
      <p class="hero-story__text" data-i18n="hero.story1"></p>
    </div>
    <div class="hero-story__part hero-story__part--2">
      <p class="hero-story__num">02</p>
      <p class="hero-story__text" data-i18n="hero.story2"></p>
    </div>
    <div class="hero-story__part hero-story__part--3">
      <p class="hero-story__num">03</p>
      <p class="hero-story__text" data-i18n="hero.story3"></p>
    </div>
    <div class="hero-cta-row">
      <a href="portfolio.html" class="btn-primary"   data-i18n="hero.cta1"></a>
      <a href="#contact"       class="btn-secondary" data-i18n="hero.cta2"></a>
    </div>
  </div>
</section>

<!-- ═══════════════════════════════
     TICKER
════════════════════════════════ -->
<div class="ticker">
  <div class="ticker-inner" id="ticker-inner"></div>
</div>

<!-- ═══════════════════════════════
     PROCESS
════════════════════════════════ -->
<section id="process">
  <div class="reveal">
    <p class="section-label"  data-i18n="process.label"></p>
    <h2 class="section-title" data-i18n="process.title"></h2>
  </div>

  <div class="process-wrap reveal">
    <div class="process-step">
      <div class="process-step-num">01</div>
      <div class="process-step-title" data-i18n="process.s1.title"></div>
      <p data-i18n="process.s1.body"></p>
    </div>
    <div class="process-step">
      <div class="process-step-num">02</div>
      <div class="process-step-title" data-i18n="process.s2.title"></div>
      <p data-i18n="process.s2.body"></p>
    </div>
    <div class="process-step">
      <div class="process-step-num">03</div>
      <div class="process-step-title" data-i18n="process.s3.title"></div>
      <p data-i18n="process.s3.body"></p>
    </div>
    <div class="process-step">
      <div class="process-step-num">04</div>
      <div class="process-step-title" data-i18n="process.s4.title"></div>
      <p data-i18n="process.s4.body"></p>
    </div>
  </div>
</section>

<!-- ═══════════════════════════════
     BILINGUAL BANNER
════════════════════════════════ -->
<div class="bilingual-banner reveal">
  <div class="left">
    <h2 data-i18n="banner.title"></h2>
  </div>
  <div class="right">
    <p data-i18n="banner.body"></p>
    <a href="#contact" class="btn-dark" data-i18n="banner.cta"></a>
  </div>
</div>

<!-- ═══════════════════════════════
     CONTACT
════════════════════════════════ -->
<section id="contact">
  <div class="contact-wrap">

    <div class="reveal">
      <p class="section-label"  data-i18n="contact.label"></p>
      <h2 class="section-title" data-i18n="contact.title"></h2>
      <p class="section-sub contact-sub" data-i18n="contact.sub"></p>

      <div class="contact-item">
        <div class="contact-icon">📍</div>
        <div>
          <div class="contact-item-label" data-i18n="contact.loc.label"></div>
          <div class="contact-item-val">Hermosillo, Sonora, México</div>
        </div>
      </div>
      <div class="contact-item">
        <div class="contact-icon">🌐</div>
        <div>
          <div class="contact-item-label" data-i18n="contact.soc.label"></div>
          <div class="contact-item-val">@gilbertoesp</div>
        </div>
      </div>
      <div class="contact-item">
        <div class="contact-icon">💬</div>
        <div>
          <div class="contact-item-label" data-i18n="contact.lang.label"></div>
          <div class="contact-item-val">English &amp; Español</div>
        </div>
      </div>
    </div>

    <div class="reveal">
      <div class="form-group">
        <label data-i18n="form.name"></label>
        <input type="text" placeholder="e.g. María García" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label data-i18n="form.service"></label>
        <select id="f-service">
          <option value="" data-i18n="form.select"></option>
          <option data-i18n="form.opt1"></option>
          <option data-i18n="form.opt2"></option>
          <option data-i18n="form.opt3"></option>
          <option data-i18n="form.opt4"></option>
          <option data-i18n="form.opt5"></option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="form.message"></label>
        <textarea id="f-msg" data-i18n-placeholder="form.placeholder"></textarea>
      </div>
      <button class="btn-submit" id="submit-btn" data-i18n="form.submit"></button>
    </div>

  </div>
</section>

<!-- ═══════════════════════════════
     FOOTER
════════════════════════════════ -->
<footer>
  <div class="footer-brand">@gilbertoesp</div>
  <ul class="footer-links">
    <li><a href="blog.html"      data-i18n="nav.blog"></a></li>
    <li><a href="portfolio.html" data-i18n="nav.portfolio"></a></li>
    <li><a href="material.html"  data-i18n="nav.material"></a></li>
    <li><a href="index.html#contact" data-i18n="nav.contact"></a></li>
  </ul>
  <div class="footer-copy" data-i18n="footer.copy"></div>
</footer>

<script src="script.js" defer></script>
</body>
</html>
