<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Material — gilbertoesp</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Barlow+Condensed:wght@300;400;600;700&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ═══════════════════════════════
     NAV
════════════════════════════════ -->
<nav>
  <a href="index.html" class="nav-logo"><span>@</span>gilbertoesp</a>

  <div class="nav-right">
    <ul class="nav-links" id="nav-links">
      <li><a href="blog.html"      data-i18n="nav.blog"      onclick="closeNav()">Blog</a></li>
      <li><a href="portfolio.html" data-i18n="nav.portfolio" onclick="closeNav()">Portfolio</a></li>
      <li><a href="material.html"  data-i18n="nav.material"  aria-current="page" onclick="closeNav()">Material</a></li>
      <li><a href="index.html#contact" data-i18n="nav.contact" onclick="closeNav()">Contact</a></li>
    </ul>

    <button class="lang-toggle" id="lang-toggle" aria-label="Cambiar a español">
      <span class="flag-emoji" id="flag-to-es">🇲🇽</span>
      <span class="flag-emoji" id="flag-to-en">🇺🇸</span>
    </button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ═══════════════════════════════
     PAGE HERO
════════════════════════════════ -->
<div class="page-hero">
  <p class="section-label" data-i18n="material.label"></p>
  <h1 class="section-title" data-i18n="material.title"></h1>
  <p class="section-sub" data-i18n="material.sub"></p>
</div>

<!-- ═══════════════════════════════
     MATERIAL SECTIONS (data-driven)
════════════════════════════════ -->
<div id="material-reading" class="material-section reveal">
  <div class="section-label" data-i18n="material.reading">Reading</div>
  <div class="material-list"></div>
</div>

<div id="material-tools" class="material-section reveal">
  <div class="section-label" data-i18n="material.tools">Tools</div>
  <div class="material-list"></div>
</div>

<div id="material-talks" class="material-section reveal">
  <div class="section-label" data-i18n="material.talks">Talks</div>
  <div class="material-list"></div>
</div>

<!-- ═══════════════════════════════
     FOOTER
════════════════════════════════ -->
<footer>
  <div class="footer-brand">@gilbertoesp</div>
  <ul class="footer-links">
    <li><a href="blog.html"      data-i18n="nav.blog"></a></li>
    <li><a href="portfolio.html" data-i18n="nav.portfolio"></a></li>
    <li><a href="material.html"  data-i18n="nav.material"></a></li>
    <li><a href="index.html#contact" data-i18n="nav.contact"></a></li>
  </ul>
  <div class="footer-copy" data-i18n="footer.copy"></div>
</footer>

<script src="script.js" defer></script>
</body>
</html>
